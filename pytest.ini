[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts =
    --alluredir=testReport/Execution_Backup/report/allure-results
    --html=testReport/Execution_Backup/report/pytest_html_report.html
    --self-contained-html

# ── Custom marks ──────────────────────────────────────────────────────────────
# Register all custom marks here to suppress PytestUnknownMarkWarning.
markers =
    smoke: CI gate smoke tests — fast, no browser/API/LLM required
    unit: Fast unit tests with no external dependencies
    integration: Tests requiring browser, API, or Excel connection
    ui: Playwright UI end-to-end tests
    api: REST API tests using requests
    security: Security-focused test cases (SQL injection, XSS, auth bypass)
    boundary: Boundary value analysis test cases
    regression: Regression tests that must pass before every release
