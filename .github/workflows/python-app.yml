name: Python Application CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps

      - name: Create repo local test directories
        run: |
          mkdir -p testData
          mkdir -p testReport/Execution_Backup/report
          mkdir -p testReport/UI_Screenshots
          mkdir -p testReport/Videos
          mkdir -p testReport/Traces
          mkdir -p storageState

      - name: Build Docker image
        run: docker build -t qa-ai-automation .

      - name: Run smoke test
        run: pytest --maxfail=1 --disable-warnings -q tests/test_ci_smoke.py

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: '**/pytest_html_report.html'
